# La fabbrica delle lezioni: un giro alla volta, uno dopo l'altro. Ogni giro fa un pezzo di lavoro, lo salva nel ramo
# `corso` e si ferma; poi la fabbrica si rilancia da sola (job «rilancio») e il giro dopo riparte da lì.
# Vedi docs/architettura.md.

name: Fabbrica

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      riprova:
        description: "Il corso è fermo su una lezione: riapri il suo cantiere e riprova"
        type: boolean
        default: false

# Un giro alla volta: se un giro è ancora in corso, il successivo aspetta (non lo interrompe).
concurrency:
  group: fabbrica
  cancel-in-progress: false

permissions: {}

jobs:
  giro:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      # Spingere il ramo `corso` (il ramo `main` è protetto: lo può cambiare solo il proprietario).
      contents: write
      # Leggere le segnalazioni del proprietario, rispondere, avvisare quando il corso si ferma.
      issues: write
    steps:
      - name: Codice (ramo main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: codice
          persist-credentials: false

      - name: Lavoro della fabbrica (ramo corso)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: corso
          path: corso
          fetch-depth: 1
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: codice/package-lock.json

      # Godot gira con un utente a parte: non può leggere i file né l'ambiente della fabbrica (dove stanno le chiavi).
      - name: Utente separato per Godot, cartelle di lavoro
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin htdgodot
          # Le protezioni del kernel sui collegamenti nelle cartelle condivise (di solito già attive: qui si fissano).
          sudo sysctl -q -w fs.protected_symlinks=1 fs.protected_hardlinks=1 fs.protected_regular=2 fs.protected_fifos=2
          sudo mkdir -p /opt/htd-cache
          sudo chown "$(id -u):$(id -g)" /opt/htd-cache
          chmod 755 /opt/htd-cache

      - name: Godot e documentazione già scaricati
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/htd-cache/strumenti
            /opt/htd-cache/godot-docs-*
            /opt/htd-cache/docs-*.sqlite
          key: fabbrica-${{ hashFiles('codice/motori/godot/engine.json') }}

      # Lo script lascia il mirror Ubuntu di Azure se è lento: un passo di 30 minuti toglierebbe il tempo al giro.
      - name: Schermo finto e ffmpeg (per i video del risultato)
        timeout-minutes: 10
        run: bash codice/.github/pacchetti-di-sistema.sh

      - name: Dipendenze
        working-directory: codice
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Compilazione
        working-directory: codice
        run: npm run compila --workspace fabbrica

      - name: Giro
        working-directory: codice
        env:
          HTD_DATI: ${{ github.workspace }}/corso
          HTD_CACHE: /opt/htd-cache
          HTD_GODOT_UTENTE: htdgodot
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RIPROVA: ${{ inputs.riprova && '--riprova' || '' }}
        run: node fabbrica/dist/giro.mjs $RIPROVA

  # GitHub a volte non avvia i workflow a orario (dalla pubblicazione del repository, il 16 ottobre 2026, non l'ha mai
  # fatto). La fabbrica allora si rilancia da sola: finito un giro, aspetta quanto serve (al massimo 15 minuti; 45 se il
  # corso è fermo o finito, per leggere comunque le segnalazioni) e avvia il giro successivo. Il token del workflow può
  # avviare un workflow (workflow_dispatch): è l'unico permesso di questo passo. L'orario sopra resta come riserva.
  # Per fermare la fabbrica: annullare il giro in corso (Cancel run) o disattivare il workflow.
  rilancio:
    needs: giro
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      actions: write
      contents: read
    steps:
      - name: Attesa e giro successivo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          altri_in_coda() {
            for w in fabbrica.yml prova-scrittore.yml; do
              n="$(gh run list --workflow "$w" --limit 10 --json status,databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\")] | length" || echo 0)"
              [ "${n:-0}" -gt 0 ] && return 0
            done
            return 1
          }
          stato="$(gh api "repos/$GH_REPO/contents/stato/aula.json?ref=corso" --jq '.content' | base64 -d 2>/dev/null || echo '{}')"
          fase="$(jq -r '.stato // "sconosciuto"' <<< "$stato" 2>/dev/null || echo sconosciuto)"
          riprende="$(jq -r '.riprende // empty' <<< "$stato" 2>/dev/null || true)"
          massimo=900
          attesa=60
          case "$fase" in ferma|finito) massimo=2700; attesa=2700 ;; esac
          quando="$(date -d "$riprende" +%s 2>/dev/null || echo 0)"
          [ -n "$riprende" ] && [ "$quando" -gt 0 ] && attesa=$(( quando - $(date +%s) + 30 ))
          [ "$attesa" -lt 60 ] && attesa=60
          [ "$attesa" -gt "$massimo" ] && attesa=$massimo
          echo "Stato della fabbrica: $fase. Il prossimo giro parte tra $attesa secondi."
          sleep "$attesa"
          if altri_in_coda; then echo "C'è già un giro in coda: continua lui."; exit 0; fi
          for tentativo in 1 2 3; do
            gh workflow run fabbrica.yml --ref main && { echo "Giro successivo avviato."; exit 0; }
            sleep 20
          done
          echo "Non sono riuscito ad avviare il giro successivo: riparte con l'orario o con Run workflow."
          exit 1
