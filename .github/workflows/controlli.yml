# I controlli del codice a ogni modifica: tipi e prove (compresa la catena di scrittura con il Godot vero e un
# fornitore finto: nessuna chiave, nessuna richiesta vera).

name: Controlli

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controlli:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      # Come nella fabbrica: schermo finto e ffmpeg, per provare anche la registrazione dei video del risultato.
      - name: Schermo finto e ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb ffmpeg libgl1-mesa-dri > /dev/null

      - name: Dipendenze
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Tipi
        run: npm run tipi

      - name: Piano del corso coerente
        run: npm run piano -- --controlla

      - name: Prove
        run: npm run prove

      # Tutte le dipendenze, anche quelle «di sviluppo»: le librerie dell'aula sono impacchettate dentro il programma.
      - name: Dipendenze senza vulnerabilità note gravi
        run: npm audit --audit-level=high
